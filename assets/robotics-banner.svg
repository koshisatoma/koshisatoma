<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF0000"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#1E90FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E90FF" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- SCAN LINE -->
  <rect x="0" y="0" width="1200" height="3" fill="#FF0000" opacity="0.30">
    <animate attributeName="y" values="0;417;0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- FLOATING PARTICLES -->
  <circle cx="320" cy="400" r="3" fill="#1E90FF">
    <animate attributeName="cy" values="420;-20" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="540" cy="400" r="2.5" fill="#FF0000">
    <animate attributeName="cy" values="420;-20" dur="12s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="12s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="400" r="3" fill="#FFFFFF">
    <animate attributeName="cy" values="420;-20" dur="10s" begin="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="10s" begin="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="400" r="2" fill="#1E90FF">
    <animate attributeName="cy" values="420;-20" dur="8s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="8s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- SYSTEM STATUS -->
  <circle cx="1105" cy="26" r="5" fill="#FF0000">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="1120" y="31" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF" opacity="0.8">ONLINE</text>

  <!-- ===== HUMANOID ROBOT (LEFT) ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="175 330;175 320;175 330" dur="3.2s" repeatCount="indefinite"/>

    <!-- antenna -->
    <line x1="0" y1="-216" x2="0" y2="-238" stroke="#FF0000" stroke-width="3"/>
    <circle cx="0" cy="-244" r="5" fill="#FF0000">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- head -->
    <rect x="-34" y="-216" width="68" height="56" rx="16" fill="#E8EEF7" stroke="#1E90FF" stroke-width="3"/>
    <rect x="-24" y="-206" width="48" height="30" rx="9" fill="#050810"/>
    <!-- blinking eyes -->
    <ellipse cx="-11" cy="-191" rx="4.5" ry="4.5" fill="#1E90FF">
      <animate attributeName="ry" values="4.5;4.5;0.4;4.5;4.5" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="11" cy="-191" rx="4.5" ry="4.5" fill="#1E90FF">
      <animate attributeName="ry" values="4.5;4.5;0.4;4.5;4.5" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>

    <!-- neck -->
    <rect x="-9" y="-162" width="18" height="14" fill="#9fb3c8"/>

    <!-- torso -->
    <rect x="-42" y="-150" width="84" height="84" rx="18" fill="#E8EEF7" stroke="#1E90FF" stroke-width="3"/>
    <!-- pulsing chest core -->
    <circle cx="0" cy="-108" r="16" fill="none" stroke="#1E90FF" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="-108" r="10" fill="#FF0000">
      <animate attributeName="r" values="9;12;9" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.6;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>

    <!-- static arm (left) -->
    <circle cx="-42" cy="-138" r="9" fill="#1E90FF"/>
    <rect x="-56" y="-134" width="14" height="46" rx="7" fill="#E8EEF7"/>
    <circle cx="-49" cy="-86" r="7" fill="#1E90FF"/>
    <rect x="-56" y="-84" width="14" height="40" rx="7" fill="#E8EEF7"/>
    <circle cx="-49" cy="-40" r="8" fill="#9fb3c8"/>

    <!-- waving arm (right) -->
    <g transform="translate(42,-138)">
      <circle r="9" fill="#1E90FF"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="15;-30;15" dur="2.2s" repeatCount="indefinite"/>
        <rect x="-7" y="-52" width="14" height="52" rx="7" fill="#E8EEF7"/>
        <circle cx="0" cy="-52" r="7" fill="#1E90FF"/>
        <rect x="-7" y="-96" width="14" height="44" rx="7" fill="#E8EEF7"/>
        <circle cx="0" cy="-100" r="9" fill="#9fb3c8"/>
      </g>
    </g>

    <!-- legs -->
    <rect x="-26" y="-70" width="20" height="62" rx="8" fill="#E8EEF7"/>
    <rect x="6" y="-70" width="20" height="62" rx="8" fill="#E8EEF7"/>
    <rect x="-32" y="-12" width="30" height="12" rx="6" fill="#1E90FF"/>
    <rect x="2" y="-12" width="30" height="12" rx="6" fill="#1E90FF"/>
  </g>

  <!-- ===== 6-DOF ROBOT ARM (RIGHT) ===== -->
  <g transform="translate(1010,332)">
    <rect x="-78" y="-12" width="156" height="16" rx="5" fill="#2a3442"/>

    <!-- shoulder rotation -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-14;12;-14" dur="6s" repeatCount="indefinite"/>
      <rect x="-14" y="-96" width="28" height="96" rx="10" fill="#FF0000"/>
      <circle cx="0" cy="-96" r="15" fill="#E8EEF7" stroke="#FF0000" stroke-width="5"/>

      <!-- elbow rotation -->
      <g transform="translate(0,-96)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="30;75;30" dur="6s" repeatCount="indefinite"/>
          <circle r="12" fill="#E8EEF7" stroke="#FF0000" stroke-width="5"/>
          <rect x="-10" y="-78" width="20" height="78" rx="9" fill="#FF3b3b"/>

          <!-- wrist + gripper -->
          <g transform="translate(0,-78)">
            <circle r="9" fill="#E8EEF7" stroke="#FF0000" stroke-width="4"/>
            <rect x="-13" y="-6" width="26" height="8" rx="3" fill="#2a3442"/>
            <!-- left finger -->
            <g>
              <animateTransform attributeName="transform" type="translate" values="0 0;-7 0;-7 0;0 0" keyTimes="0;0.35;0.6;1" dur="3s" repeatCount="indefinite"/>
              <rect x="-11" y="-28" width="7" height="24" rx="3" fill="#E8EEF7"/>
            </g>
            <!-- right finger -->
            <g>
              <animateTransform attributeName="transform" type="translate" values="0 0;7 0;7 0;0 0" keyTimes="0;0.35;0.6;1" dur="3s" repeatCount="indefinite"/>
              <rect x="4" y="-28" width="7" height="24" rx="3" fill="#E8EEF7"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ===== CENTER TEXT ===== -->
  <text x="600" y="120" text-anchor="middle" font-family="Consolas, monospace" font-size="54" font-weight="bold" fill="url(#nameGrad)">KOSHI SATOMA</text>
  <text x="600" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#8fa3b8" letter-spacing="5">PHYSICAL AI • COMPUTER VISION • WORLD MODELS</text>

  <!-- ROTATING ROLES -->
  <text x="600" y="250" text-anchor="middle" font-family="Consolas, monospace" font-size="27" font-weight="bold" fill="#FF0000" opacity="0">
    COMPUTER VISION ENGINEER
    <animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.3;0.34;0.66;0.96;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="250" text-anchor="middle" font-family="Consolas, monospace" font-size="27" font-weight="bold" fill="#1E90FF" opacity="0">
    ROBOTICS SOFTWARE ENGINEER
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.34;0.64;0.66;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="250" text-anchor="middle" font-family="Consolas, monospace" font-size="27" font-weight="bold" fill="#FFFFFF" opacity="0">
    ROBOT BODY DEVELOPMENT ENGINEER
    <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.3;0.6;0.64;0.66;0.97" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- blinking cursor bar -->
  <rect x="575" y="268" width="50" height="4" fill="#FF0000">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom line -->
  <line x1="200" y1="395" x2="1000" y2="395" stroke="#1E90FF" stroke-width="1" stroke-dasharray="8 10" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-360" dur="6s" repeatCount="indefinite"/>
  </line>
</svg>
